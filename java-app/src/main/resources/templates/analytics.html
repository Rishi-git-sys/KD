<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Analytics')}"></head><body><div class="app-shell"><aside th:replace="~{layout :: sidebar('analytics')}"></aside><div><header th:replace="~{layout :: topbar('Analytics','Insights / Visualisations')}"></header><main class="content"><div class="d-flex justify-content-between align-items-center mb-4"><div><h2 class="h4">Employment trend analytics</h2><p class="text-muted mb-0">Visual reports generated by the Python analysis pipeline.</p></div><form method="post" action="/analytics/regenerate"><button class="btn btn-primary" data-loading><i class="bi bi-arrow-repeat me-1"></i>Regenerate charts</button></form></div><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="row g-4"><div class="col-sm-6 col-xl-4" th:each="chart:${charts}"><div class="card analytics-card h-100"><img class="card-img-top" data-lightbox th:src="@{/charts/{file}(file=${chart})}" th:alt="${chart}"><div class="card-body"><h3 class="h6" th:text="${#strings.replace(chart,'_',' ')}"></h3><p class="text-muted small mb-0">Click to inspect this placement trend visualisation.</p></div></div></div></div><div th:if="${#lists.isEmpty(charts)}" class="empty"><i class="bi bi-bar-chart"></i><strong>No charts available</strong><p>Regenerate charts once the Python environment is configured.</p></div></main><footer th:replace="~{layout :: footer}"></footer></div></div><div class="modal fade" id="lightbox" tabindex="-1"><div class="modal-dialog modal-xl modal-dialog-centered"><div class="modal-content"><img id="lightboxImage" class="img-fluid" alt="Chart preview"></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script></body></html>
