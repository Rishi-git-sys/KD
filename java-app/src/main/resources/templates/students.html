<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Students')}"></head><body><div class="app-shell"><aside th:replace="~{layout :: sidebar('students')}"></aside><div><header th:replace="~{layout :: topbar('Students','Directory / Students')}"></header><main class="content"><div class="d-flex justify-content-between align-items-center mb-4"><div><h2 class="h4 mb-1">Student directory</h2><p class="text-muted mb-0">Manage candidate profiles.</p></div><a class="btn btn-primary" href="/students/new"><i class="bi bi-person-plus me-1"></i>Add student</a></div><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div class="card"><div class="card-body border-bottom"><form class="row g-2"><div class="col-md-7"><input class="form-control" name="q" th:value="${q}" placeholder="Search name or email"></div><div class="col-auto"><button class="btn btn-outline-secondary">Search</button></div></form></div><div class="table-wrap"><table class="table table-hover"><thead><tr><th>ID</th><th>Student</th><th>Department</th><th>CGPA</th><th>Email</th><th></th></tr></thead><tbody><tr th:each="r:${rows}"><td th:text="${r.student_id}"></td><td><strong th:text="${r.name}"></strong></td><td th:text="${r.department}"></td><td th:text="${r.cgpa}"></td><td th:text="${r.email}"></td><td class="text-end"><a class="btn btn-light btn-icon" th:href="@{/students/{id}/edit(id=${r.student_id})}"><i class="bi bi-pencil"></i></a><form class="d-inline" th:action="@{/students/{id}/delete(id=${r.student_id})}" method="post"><button class="btn btn-light text-danger btn-icon" data-loading><i class="bi bi-trash"></i></button></form></td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="6"><div class="empty"><i class="bi bi-people"></i>No records found</div></td></tr></tbody></table></div></div></main><footer th:replace="~{layout :: footer}"></footer></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/app.js"></script></body></html>
