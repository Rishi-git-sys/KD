<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Applications')}"></head><body><div class="app-shell"><aside th:replace="~{layout :: sidebar('applications')}"></aside><div><header th:replace="~{layout :: topbar('Applications','Recruitment / Pipeline')}"></header><main class="content"><div class="d-flex justify-content-between mb-4"><div><h2 class="h4">Application pipeline</h2><p class="text-muted">Review and progress candidate applications.</p></div><a href="/apply" class="btn btn-primary">New application</a></div><div class="card"><div class="card-body border-bottom"><form><select name="status" class="form-select w-auto" onchange="this.form.submit()"><option value="">All statuses</option><option th:each="x:${ {'APPLIED','SHORTLISTED','SELECTED','REJECTED'} }" th:value="${x}" th:selected="${x==status}" th:text="${x}"></option></select></form></div><div class="table-wrap"><table class="table table-hover"><thead><tr><th>Student</th><th>Company</th><th>Role</th><th>Status</th><th class="text-end">Actions</th></tr></thead><tbody><tr th:each="r:${rows}"><td><strong th:text="${r.student}"></strong></td><td th:text="${r.company}"></td><td th:text="${r.job_title}"></td><td><span class="badge" th:classappend="${' status-'+r.status}" th:text="${r.status}"></span></td><td class="text-end"><form th:if="${r.status=='APPLIED'||r.status=='SHORTLISTED'}" th:action="@{/applications/{id}/status(id=${r.application_id})}" method="post"><button name="target" value="SHORTLISTED" th:if="${r.status=='APPLIED'}" class="btn btn-sm btn-warning" data-loading>Shortlist</button><button name="target" value="SELECTED" th:if="${r.status=='SHORTLISTED'}" class="btn btn-sm btn-success" data-loading>Select</button><button name="target" value="REJECTED" class="btn btn-sm btn-outline-danger" data-loading>Reject</button></form></td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="5"><div class="empty"><i class="bi bi-inbox"></i>No records found</div></td></tr></tbody></table></div></div></main><footer th:replace="~{layout :: footer}"></footer></div></div><script src="/js/app.js"></script></body></html>
