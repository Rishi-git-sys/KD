spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_portal?serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.thymeleaf.cache=false
portal.python.path=${PYTHON_PATH:python}
portal.analysis.output=${ANALYSIS_OUTPUT:../python-analysis/output}
springdoc.swagger-ui.path=/swagger-ui.html
