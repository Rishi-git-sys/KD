<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Dashboard')}"></head><body><div class="app-shell"><aside th:replace="~{layout :: sidebar('dashboard')}"></aside><div><header th:replace="~{layout :: topbar('Dashboard','PlaceHub / Overview')}"></header><main class="content"><div class="d-flex justify-content-between align-items-center mb-4"><div><h2 class="h4 mb-1">Placement overview</h2><p class="text-muted mb-0">Live recruitment activity at a glance.</p></div><a class="btn btn-primary" href="/apply"><i class="bi bi-send me-1"></i>New application</a></div><div class="row g-3 mb-4"><div class="col-6 col-lg"><div class="card kpi"><div class="kpi-icon accent-indigo"><i class="bi bi-people"></i></div><div class="kpi-number" th:text="${students}">0</div><div class="kpi-label">Students</div></div></div><div class="col-6 col-lg"><div class="card kpi"><div class="kpi-icon accent-green"><i class="bi bi-buildings"></i></div><div class="kpi-number" th:text="${companies}">0</div><div class="kpi-label">Companies</div></div></div><div class="col-6 col-lg"><div class="card kpi"><div class="kpi-icon accent-amber"><i class="bi bi-briefcase"></i></div><div class="kpi-number" th:text="${vacancies}">0</div><div class="kpi-label">Open vacancies</div></div></div><div class="col-6 col-lg"><div class="card kpi"><div class="kpi-icon accent-indigo"><i class="bi bi-file-text"></i></div><div class="kpi-number" th:text="${applications}">0</div><div class="kpi-label">Applications</div></div></div><div class="col-6 col-lg"><div class="card kpi"><div class="kpi-icon accent-green"><i class="bi bi-award"></i></div><div class="kpi-number" th:text="${selections}">0</div><div class="kpi-label">Selections</div></div></div></div><div class="row g-3"><div class="col-lg-4"><div class="card chart-card"><h3 class="h6">Application pipeline</h3><canvas id="statusChart"></canvas></div></div><div class="col-lg-4"><div class="card chart-card"><h3 class="h6">Company recruitment</h3><canvas id="companyChart"></canvas></div></div><div class="col-lg-4"><div class="card chart-card"><h3 class="h6">Recent applications</h3><div id="recent" class="small text-muted">Loading…</div></div></div></div></main><footer th:replace="~{layout :: footer}"></footer></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="/js/app.js"></script><script>Promise.all([fetch('/api/applications').then(r=>r.json()),fetch('/api/reports/companies').then(r=>r.json())]).then(([apps,co])=>{let s={APPLIED:0,SHORTLISTED:0,SELECTED:0,REJECTED:0};apps.forEach(a=>s[a.status]++);new Chart(statusChart,{type:'doughnut',data:{labels:Object.keys(s),datasets:[{data:Object.values(s),backgroundColor:['#60a5fa','#fbbf24','#22c55e','#ef4444']}]}});new Chart(companyChart,{type:'bar',data:{labels:co.slice(0,6).map(x=>x.name),datasets:[{data:co.slice(0,6).map(x=>x.selections),backgroundColor:'#4f46e5'}]}});recent.innerHTML=apps.slice(0,5).map(a=>`<div class='py-2 border-bottom'><b>${a.student}</b><br>${a.job_title} · ${a.status}</div>`).join('')||'No recent applications.'})</script></body></html>
