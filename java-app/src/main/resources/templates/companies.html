<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-4"><a href="/">← Dashboard</a><h1>Companies <a class="btn btn-primary" href="/companies/new">Add</a></h1><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><table class="table"><tr><th>Name</th><th>Industry</th><th>Location</th><th>Contact</th><th></th></tr><tr th:each="r:${rows}"><td th:text="${r.name}"></td><td th:text="${r.industry}"></td><td th:text="${r.location}"></td><td th:text="${r.contact}"></td><td><a th:href="@{/companies/{id}/edit(id=${r.company_id})}">Edit</a> <form class="d-inline" method="post" th:action="@{/companies/{id}/delete(id=${r.company_id})}"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr></table></main></body></html>
