<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Job Portal</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-primary px-4"><a class="navbar-brand" href="/">Job Portal</a><span><a class="text-white me-3" href="/students">Students</a><a class="text-white me-3" href="/companies">Companies</a><a class="text-white me-3" href="/vacancies">Vacancies</a><a class="text-white me-3" href="/apply">Apply</a><a class="text-white me-3" href="/applications">Applications</a><a class="text-white me-3" href="/reports">Reports</a><a class="text-white" href="/analytics">Analytics</a></span></nav><main class="container py-4"><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><h1>Placement dashboard</h1><div class="row g-3"><div class="col-md" th:each="x:${ {'Students':students,'Companies':companies,'Open vacancies':vacancies,'Applications':applications,'Selections':selections} }"><div class="card shadow-sm"><div class="card-body"><small th:text="${x.key}"></small><h2 th:text="${x.value}"></h2></div></div></div></div></main></body></html>
