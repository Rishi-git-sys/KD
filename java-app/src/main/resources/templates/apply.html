<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Apply for job')}"></head><body><div class="app-shell"><aside th:replace="~{layout :: sidebar('apply')}"></aside><div><header th:replace="~{layout :: topbar('Apply for a job','Recruitment / New application')}"></header><main class="content"><div class="row g-4"><div class="col-lg-8"><form method="post" action="/apply" class="card p-4"><h2 class="h5 mb-4">Application details</h2><label class="form-label">Select student</label><select class="form-select mb-3" name="studentId"><option th:each="s:${students}" th:value="${s.student_id}" th:text="${s.name+' — CGPA '+s.cgpa}"></option></select><label class="form-label">Select open vacancy</label><select class="form-select mb-4" name="vacancyId"><option th:each="v:${vacancies}" th:if="${v.status=='OPEN'}" th:value="${v.vacancy_id}" th:text="${v.company+' — '+v.job_title}"></option></select><button class="btn btn-primary" data-loading><i class="bi bi-send me-1"></i>Submit application</button></form></div><div class="col-lg-4"><div class="card p-4 mb-3"><h3 class="h6"><i class="bi bi-shield-check text-success me-2"></i>Eligibility checks</h3><p class="small text-muted mb-0">The system checks CGPA, permitted department, qualification, vacancy status, last date and duplicate applications before submission.</p></div><div class="card p-4"><h3 class="h6">Helpful tip</h3><p class="small text-muted mb-0">Choose a student and role carefully; a friendly alert appears if the application cannot be submitted.</p></div></div></div></main><footer th:replace="~{layout :: footer}"></footer></div></div><script src="/js/app.js"></script></body></html>
