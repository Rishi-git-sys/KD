<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Student profile')}"></head><body><div class="app-shell"><aside th:replace="~{layout :: sidebar('students')}"></aside><div><header th:replace="~{layout :: topbar('Student profile','Students / Edit')}"></header><main class="content"><form th:action="@{/students}" th:object="${student}" method="post" class="card p-4"><input type="hidden" th:field="*{studentId}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" th:field="*{name}"><small class="text-danger" th:errors="*{name}"></small></div><div class="col-md-6"><label class="form-label">Department</label><select class="form-select" th:field="*{departmentId}"><option th:each="d:${departments}" th:value="${d.department_id}" th:text="${d.name}"></option></select></div><div class="col-md-4"><label class="form-label">Qualification</label><input class="form-control" th:field="*{qualification}"></div><div class="col-md-4"><label class="form-label">CGPA</label><input class="form-control" th:field="*{cgpa}"><small class="text-danger" th:errors="*{cgpa}"></small></div><div class="col-md-4"><label class="form-label">Phone</label><input class="form-control" th:field="*{phone}"></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" th:field="*{email}"><small class="text-danger" th:errors="*{email}"></small></div><div class="col-md-6"><label class="form-label">Skills</label><input class="form-control" th:field="*{skills}"></div></div><div class="mt-4"><button class="btn btn-primary" data-loading><i class="bi bi-check2 me-1"></i>Save student</button><a class="btn btn-light ms-2" href="/students">Cancel</a></div></form></main><footer th:replace="~{layout :: footer}"></footer></div></div><script src="/js/app.js"></script></body></html>
