<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Reports')}"></head><body><div class="app-shell"><aside th:replace="~{layout :: sidebar('reports')}"></aside><div><header th:replace="~{layout :: topbar('Reports','Insights / Reports')}"></header><main class="content"><div class="d-flex justify-content-between mb-4"><div><h2 class="h4">Placement reports</h2><p class="text-muted">Export operational summaries for placement review.</p></div><button class="btn btn-light no-print" onclick="print()"><i class="bi bi-printer"></i> Print</button></div><div class="card p-3 mb-4"><h3 class="h6">Vacancy applications <a class="btn btn-sm btn-outline-primary float-end" href="/api/reports/vacancies.csv"><i class="bi bi-download"></i> Export CSV</a></h3><div class="table-wrap"><table class="table"><tr><th>Company</th><th>Role</th><th>Applications</th><th>Selections</th></tr><tr th:each="r:${vacancies}"><td th:text="${r.company}"></td><td th:text="${r.job_title}"></td><td th:text="${r.applications}"></td><td th:text="${r.selections}"></td></tr></table></div></div><div class="card p-3"><h3 class="h6">Department placement percentage <a class="btn btn-sm btn-outline-primary float-end" href="/api/reports/departments.csv"><i class="bi bi-download"></i> Export CSV</a></h3><div class="table-wrap"><table class="table"><tr><th>Department</th><th>Students</th><th>Placed</th><th>Rate</th></tr><tr th:each="r:${departments}"><td th:text="${r.department}"></td><td th:text="${r.students}"></td><td th:text="${r.placed_students}"></td><td th:text="${r.placement_percentage+'%'}"></td></tr></table></div></div></main><footer th:replace="~{layout :: footer}"></footer></div></div></body></html>
