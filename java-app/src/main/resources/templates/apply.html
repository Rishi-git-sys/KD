<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-4"><a href="/">← Dashboard</a><h1>Apply for a job</h1><form method="post" action="/apply" class="card card-body"><label>Student</label><select class="form-select mb-3" name="studentId"><option th:each="s:${students}" th:value="${s.student_id}" th:text="${s.name+' — '+s.cgpa}"></option></select><label>Open vacancy</label><select class="form-select mb-3" name="vacancyId"><option th:each="v:${vacancies}" th:if="${v.status=='OPEN'}" th:value="${v.vacancy_id}" th:text="${v.company+' — '+v.job_title}"></option></select><button class="btn btn-primary">Submit application</button></form></main></body></html>
