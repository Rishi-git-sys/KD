<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-4"><a href="/">← Dashboard</a><h1>Analytics</h1><form method="post" action="/analytics/regenerate"><button class="btn btn-primary mb-3">Regenerate charts</button></form><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="row"><div class="col-md-6 mb-4" th:each="chart:${charts}"><div class="card"><img class="card-img-top" th:src="@{/charts/{file}(file=${chart})}" th:alt="${chart}"><div class="card-body"><small th:text="${#strings.replace(chart,'_',' ')}"></small><p class="mb-0 text-muted">Generated from the employment trend pipeline.</p></div></div></div></div><p th:if="${#lists.isEmpty(charts)}">No charts yet. Configure Python and select Regenerate Charts.</p></main></body></html>
