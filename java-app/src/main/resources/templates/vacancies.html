<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Vacancies')}"></head><body><div class="app-shell"><aside th:replace="~{layout :: sidebar('vacancies')}"></aside><div><header th:replace="~{layout :: topbar('Vacancies','Recruitment / Vacancies')}"></header><main class="content"><div class="d-flex justify-content-between mb-4"><div><h2 class="h4">Open roles</h2><p class="text-muted">Browse company opportunities and eligibility details.</p></div></div><div class="card mb-3"><div class="card-body"><form class="row g-2"><div class="col-md-4"><select name="company" class="form-select"><option value="">All companies</option><option th:each="c:${companies}" th:value="${c.company_id}" th:text="${c.name}"></option></select></div><div class="col-md-4"><input class="form-control" name="location" placeholder="Filter location"></div><div class="col-auto"><button class="btn btn-outline-secondary">Filter</button></div></form></div></div><div class="card table-wrap"><table class="table table-hover"><thead><tr><th>Company</th><th>Role</th><th>Location</th><th>Salary range</th><th>Status</th></tr></thead><tbody><tr th:each="r:${rows}"><td th:text="${r.company}"></td><td><strong th:text="${r.job_title}"></strong></td><td th:text="${r.location}"></td><td th:text="${r.min_salary+' – '+r.max_salary}"></td><td><span class="badge" th:classappend="${r.status=='OPEN'}?' status-SELECTED':' status-REJECTED'" th:text="${r.status}"></span></td></tr></tbody></table></div></main><footer th:replace="~{layout :: footer}"></footer></div></div><script src="/js/app.js"></script></body></html>
