<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-4"><a href="/">← Dashboard</a><h1>Reports</h1><p><a href="/api/reports/vacancies.csv">Export vacancy CSV</a> · <a href="/api/reports/companies.csv">Export company CSV</a> · <a href="/api/reports/departments.csv">Export department CSV</a></p><h3>Vacancy applications</h3><table class="table"><tr><th>Company</th><th>Role</th><th>Applications</th><th>Selections</th></tr><tr th:each="r:${vacancies}"><td th:text="${r.company}"></td><td th:text="${r.job_title}"></td><td th:text="${r.applications}"></td><td th:text="${r.selections}"></td></tr></table><h3>Department placement percentage</h3><table class="table"><tr><th>Department</th><th>Students</th><th>Placed</th><th>%</th></tr><tr th:each="r:${departments}"><td th:text="${r.department}"></td><td th:text="${r.students}"></td><td th:text="${r.placed_students}"></td><td th:text="${r.placement_percentage}"></td></tr></table></main></body></html>
