<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-4"><h1>Company</h1><form th:object="${company}" method="post" action="/companies" class="row g-3"><input type="hidden" th:field="*{companyId}"><div class="col-6"><input class="form-control" placeholder="Name" th:field="*{name}"></div><div class="col-6"><input class="form-control" placeholder="Industry" th:field="*{industry}"></div><div class="col-6"><input class="form-control" placeholder="Location" th:field="*{location}"></div><div class="col-6"><input class="form-control" placeholder="Email contact" th:field="*{contact}"></div><div><button class="btn btn-primary">Save</button></div></form></main></body></html>
