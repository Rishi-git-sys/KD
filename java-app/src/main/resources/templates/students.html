<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Students</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-4"><a href="/">← Dashboard</a><h1>Students</h1><form class="row g-2 mb-3"><div class="col"><input class="form-control" name="q" th:value="${q}" placeholder="Search name or email"></div><div class="col-auto"><button class="btn btn-outline-primary">Search</button><a class="btn btn-primary" href="/students/new">Add student</a></div></form><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><table class="table table-striped"><tr><th>ID</th><th>Name</th><th>Department</th><th>CGPA</th><th>Email</th><th></th></tr><tr th:each="r:${rows}"><td th:text="${r.student_id}"></td><td th:text="${r.name}"></td><td th:text="${r.department}"></td><td th:text="${r.cgpa}"></td><td th:text="${r.email}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/students/{id}/edit(id=${r.student_id})}">Edit</a><form class="d-inline" th:action="@{/students/{id}/delete(id=${r.student_id})}" method="post"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr></table></main></body></html>
