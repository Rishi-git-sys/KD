<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-4"><h1 th:text="${student.studentId==null?'Add student':'Edit student'}"></h1><form th:action="@{/students}" th:object="${student}" method="post" class="row g-3"><input type="hidden" th:field="*{studentId}"><div class="col-md-6"><label>Name</label><input class="form-control" th:field="*{name}"></div><div class="col-md-6"><label>Department</label><select class="form-select" th:field="*{departmentId}"><option th:each="d:${departments}" th:value="${d.department_id}" th:text="${d.name}"></option></select></div><div class="col-md-4"><label>Qualification</label><input class="form-control" th:field="*{qualification}"></div><div class="col-md-4"><label>CGPA</label><input class="form-control" th:field="*{cgpa}"></div><div class="col-md-4"><label>Phone</label><input class="form-control" th:field="*{phone}"></div><div class="col-md-6"><label>Email</label><input class="form-control" th:field="*{email}"></div><div class="col-md-6"><label>Skills</label><input class="form-control" th:field="*{skills}"></div><div><button class="btn btn-primary">Save</button> <a href="/students">Cancel</a></div></form></main></body></html>
