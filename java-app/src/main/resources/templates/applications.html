<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-4"><a href="/">← Dashboard</a><h1>Applications</h1><form class="mb-3"><select name="status" onchange="this.form.submit()"><option value="">All statuses</option><option th:each="x:${ {'APPLIED','SHORTLISTED','SELECTED','REJECTED'} }" th:value="${x}" th:selected="${x==status}" th:text="${x}"></option></select></form><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><table class="table"><tr><th>Student</th><th>Company</th><th>Role</th><th>Status</th><th>Action</th></tr><tr th:each="r:${rows}"><td th:text="${r.student}"></td><td th:text="${r.company}"></td><td th:text="${r.job_title}"></td><td th:text="${r.status}"></td><td><form th:if="${r.status=='APPLIED'||r.status=='SHORTLISTED'}" th:action="@{/applications/{id}/status(id=${r.application_id})}" method="post"><button name="target" value="SHORTLISTED" th:if="${r.status=='APPLIED'}" class="btn btn-sm btn-info">Shortlist</button><button name="target" value="SELECTED" th:if="${r.status=='SHORTLISTED'}" class="btn btn-sm btn-success">Select</button><button name="target" value="REJECTED" class="btn btn-sm btn-outline-danger">Reject</button></form></td></tr></table></main></body></html>
