<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Companies')}"></head><body><div class="app-shell"><aside th:replace="~{layout :: sidebar('companies')}"></aside><div><header th:replace="~{layout :: topbar('Companies','Directory / Companies')}"></header><main class="content"><div class="d-flex justify-content-between mb-4"><div><h2 class="h4">Recruiting companies</h2><p class="text-muted">Partner organization directory.</p></div><a class="btn btn-primary" href="/companies/new"><i class="bi bi-plus-lg me-1"></i>Add company</a></div><div class="card table-wrap"><table class="table table-hover"><thead><tr><th>Name</th><th>Industry</th><th>Location</th><th>Contact</th><th></th></tr></thead><tbody><tr th:each="r:${rows}"><td><strong th:text="${r.name}"></strong></td><td th:text="${r.industry}"></td><td th:text="${r.location}"></td><td th:text="${r.contact}"></td><td class="text-end"><a class="btn btn-light btn-icon" th:href="@{/companies/{id}/edit(id=${r.company_id})}"><i class="bi bi-pencil"></i></a><form class="d-inline" method="post" th:action="@{/companies/{id}/delete(id=${r.company_id})}"><button class="btn btn-light text-danger btn-icon" data-loading><i class="bi bi-trash"></i></button></form></td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="5"><div class="empty"><i class="bi bi-buildings"></i>No records found</div></td></tr></tbody></table></div></main><footer th:replace="~{layout :: footer}"></footer></div></div><script src="/js/app.js"></script></body></html>
